# Railway config for FastAPI AI service (apps/ai-services)
# In Railway: set this service Root Directory to apps/ai-services
#
# Nixpacks installs requirements.txt automatically — don't re-run pip in build.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
